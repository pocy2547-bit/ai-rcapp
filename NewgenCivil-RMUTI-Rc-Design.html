<title>Civil RMUTI Rc Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Layout: sticky title bar + tab strip, then one working view at a time;
   editor = member list | input sheet | drawing + results (stacks on phones). */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --ink: #15202B;
  --muted: #586779;
  --line: #D5DCE5;
  --accent: #1F4E79;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5EDF6;
  --signal: #C8102E;
  --ok: #1E7A3A;
  --warn: #9A5800;
  --danger: #B42318;
  --danger-soft: #FCEDEC;
  --warn-soft: #FFF4E0;
  --concrete: #DCE2E9;
  --concrete-edge: #1F4E79;
  --grid: rgba(31, 78, 121, 0.07);
  --shadow: 0 1px 2px rgba(21, 32, 43, 0.06), 0 6px 20px rgba(21, 32, 43, 0.06);
  --font-body: "Sarabun", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --font-head: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151E; --surface: #16202B; --surface-2: #1A2531; --ink: #E3E9F0; --muted: #94A3B4;
    --line: #2A3746; --accent: #7DB2E3; --accent-ink: #0E151E; --accent-soft: #1B2C3E; --signal: #F0566B;
    --ok: #5CC982; --warn: #E9A848; --danger: #F2837A; --danger-soft: #3A1E1E; --warn-soft: #3A2C14;
    --concrete: #2B3846; --concrete-edge: #7DB2E3; --grid: rgba(125, 178, 227, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151E; --surface: #16202B; --surface-2: #1A2531; --ink: #E3E9F0; --muted: #94A3B4;
  --line: #2A3746; --accent: #7DB2E3; --accent-ink: #0E151E; --accent-soft: #1B2C3E; --signal: #F0566B;
  --ok: #5CC982; --warn: #E9A848; --danger: #F2837A; --danger-soft: #3A1E1E; --warn-soft: #3A2C14;
  --concrete: #2B3846; --concrete-edge: #7DB2E3; --grid: rgba(125, 178, 227, 0.08);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
h1, h2, h3 { font-family: var(--font-head); line-height: 1.25; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------------------------------------------------------- title bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.titlebar { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark {
  width: 34px; height: 34px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 14px;
  position: relative; overflow: hidden; flex: none;
}
.mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--signal); }
.logo { width: 40px; height: 40px; object-fit: contain; flex: none; }
.brand-name { font-family: var(--font-head); font-weight: 600; font-size: 16px; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--muted); }
.project-chip {
  margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0;
  font-size: 13px; color: var(--muted);
}
.project-chip strong { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); flex: none; }
.actions { display: flex; gap: 6px; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 9px 12px; cursor: pointer; white-space: nowrap;
  color: var(--muted); border-bottom: 2px solid transparent; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 0 6px; }
.tab-sep { width: 1px; background: var(--line); margin: 8px 4px; flex: none; }

/* ---------------------------------------------------------- buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 13px; }

/* ---------------------------------------------------------- views */
main { padding-block: 20px 48px; max-width: 1360px; margin: 0 auto; }
.view-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.view-head h1 { font-size: 24px; }
.view-head p { margin: 2px 0 0; color: var(--muted); }
.view-head .spacer { flex: 1; }
.view-head .icon { width: 52px; height: 52px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
.banner {
  border: 1px solid var(--line); background: var(--warn-soft); color: var(--ink);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 14px;
  display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
}
.banner b { color: var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  font-family: var(--font-head); font-weight: 600; font-size: 14px;
}
.panel-head .hint { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: auto; }
.panel-body { padding: 14px; }

/* ---------------------------------------------------------- forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field label .req { color: var(--signal); }
.input-wrap { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.input-wrap input, .input-wrap select, .input-wrap textarea {
  border: 0; background: transparent; padding: 7px 10px; width: 100%; min-width: 0; outline: none;
}
.input-wrap input.numeric { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.input-wrap .unit {
  padding: 7px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  background: var(--surface-2); border-left: 1px solid var(--line); display: flex; align-items: center; min-width: 58px;
}
.field.invalid .input-wrap { border-color: var(--danger); background: var(--danger-soft); }
.field .err { color: var(--danger); font-size: 12px; }
.group { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
.group:first-child { border-top: 0; }
.group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 10px; font-weight: 600; }
.group .rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 190px); gap: 10px; align-items: center; }
.row > label { font-size: 14px; }
.row .err { grid-column: 1 / -1; color: var(--danger); font-size: 12px; margin-top: -4px; }
.row.invalid .input-wrap { border-color: var(--danger); background: var(--danger-soft); }

/* ---------------------------------------------------------- design selection */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 860px; margin: 0 auto; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center;
  cursor: pointer; text-align: left; transition: border-color 0.15s, transform 0.15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card:last-child:nth-child(odd) { grid-column: 1 / -1; max-width: calc(50% - 8px); justify-self: center; width: 100%; }
.card .icon { width: 96px; height: 96px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; }
.card h2 { font-size: 20px; letter-spacing: 0.04em; }
.card .en { margin: 2px 0; font-size: 14px; }
.card .th { margin: 0; font-size: 13px; color: var(--muted); }
.card .meta { margin-top: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--accent); }

/* ---------------------------------------------------------- editor */
.editor { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.members { position: sticky; top: 112px; }
.member-list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow: auto; }
.member-btn {
  width: 100%; border: 0; background: none; border-radius: 6px; padding: 7px 10px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; text-align: left;
}
.member-btn:hover { background: var(--surface-2); }
.member-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.member-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.member-btn .dot.done { background: var(--warn); }
.member-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.member-tools .btn { justify-content: center; }
.member-tools .danger { grid-column: 1 / -1; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.out-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.drawing {
  background-color: var(--surface-2);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius);
}
.drawing svg { display: block; width: 100%; height: auto; max-height: 300px; }
.drawing .shape { fill: var(--concrete); stroke: var(--concrete-edge); stroke-width: 2; }
.drawing .inner { fill: none; stroke: var(--concrete-edge); stroke-width: 1.2; stroke-dasharray: 5 4; }
.drawing .col { fill: var(--muted); stroke: var(--concrete-edge); stroke-width: 1.5; }
.drawing .dim { stroke: var(--muted); stroke-width: 1; fill: none; }
.drawing text { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; }
.drawing .title { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
.status {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: 999px;
  padding: 2px 10px; border: 1px solid currentColor;
}
.status.not_implemented { color: var(--warn); }
.status.pass { color: var(--ok); }
.status.fail, .status.error { color: var(--danger); }
.status.not_calculated { color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.u { font-family: var(--font-mono); color: var(--muted); font-size: 12px; white-space: nowrap; }
td .note { display: block; color: var(--muted); font-size: 12px; }
.msgs { margin: 0; padding: 10px 14px 12px 30px; color: var(--muted); font-size: 13px; }
.issues { margin: 0; padding: 10px 14px 10px 30px; font-size: 13px; }
.issues li.e { color: var(--danger); }
.issues li.w { color: var(--warn); }
.calc-bar { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.calc-bar .spacer { flex: 1; }

/* ---------------------------------------------------------- start view */
.start { max-width: 640px; margin: 24px auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.start-logo { width: 120px; height: 120px; object-fit: contain; }
.start h1 { font-size: 28px; }
.start-sub { margin: 0; color: var(--muted); }
.start-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
.start-actions .btn { padding: 9px 18px; font-size: 15px; }
.start-steps { text-align: left; margin: 12px 0 4px; padding: 14px 18px 14px 36px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.start-steps li { margin: 4px 0; }

/* ---------------------------------------------------------- project view */
.two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stat-list { list-style: none; margin: 0; padding: 0; }
.stat-list li { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.stat-list li:last-child { border-bottom: 0; }
.stat-list a { color: var(--accent); text-decoration: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.prose { max-width: 70ch; }
.prose h2 { font-size: 18px; margin: 18px 0 6px; }
.prose li { margin: 3px 0; }

/* ---------------------------------------------------------- modal + toast */
.modal-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 24, 0.45);
  display: grid; place-items: center; padding: 16px;
}
.modal {
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(720px, 100%);
  max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden;
}
.modal.narrow { width: min(460px, 100%); }
.modal header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal header h2 { font-size: 18px; }
.modal .body { padding: 16px 18px; overflow: auto; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.report { margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.45; white-space: pre; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; max-height: 60vh; }
textarea.raw { width: 100%; min-height: 220px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--surface-2); }
.toast {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
.toast.err { background: var(--danger); color: #fff; }

/* ---------------------------------------------------------- responsive */
@media (max-width: 1100px) {
  .editor { grid-template-columns: 180px minmax(0, 1fr); }
  .editor .out-stack { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  body { font-size: 15px; }
  .brand-sub { display: none; }
  .project-chip { order: 3; width: 100%; margin-left: 0; }
  .actions { margin-left: auto; }
  .actions .label { display: none; }
  .editor { grid-template-columns: minmax(0, 1fr); }
  .members { position: static; }
  .member-list { flex-direction: row; overflow-x: auto; max-height: none; }
  .member-btn { white-space: nowrap; }
  .member-tools { grid-template-columns: repeat(3, 1fr); }
  .member-tools .danger { grid-column: auto; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card:last-child:nth-child(odd) { max-width: none; }
  .card { grid-template-columns: 72px minmax(0, 1fr); }
  .card .icon { width: 72px; height: 72px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>

  // ------------------------------------------------------------ formatting
  /** Python format(x, "g"). */
  function g(x) {
    if (!Number.isFinite(x)) return String(x);
    if (x === 0) return "0";
    const exp = Math.floor(Math.log10(Math.abs(x)));
    if (exp < -4 || exp >= 6) {
      let [mant, e] = x.toExponential(5).split("e");
      mant = mant.replace(/\.?0+$/, "");
      const n = parseInt(e, 10);
      return `${mant}e${n < 0 ? "-" : "+"}${String(Math.abs(n)).padStart(2, "0")}`;
    }
    return String(Number(x.toPrecision(6)));
  }

  function grouped(x, digits) {
    return x.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  /** ResultItem.formatted_value */
  function formatValue(value) {
    if (typeof value === "number") {
      let text = grouped(value, 3);
      text = text.replace(/0+$/, "").replace(/\.$/, "");
      return text;
    }
    return String(value);
  }

  // ------------------------------------------------------------ validation
  function isBlank(value) {
    return value === null || value === undefined || (typeof value === "string" && !value.trim());
  }

  const NUMBER_RE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;

  /** app.utils.validators.parse_number */
  function parseNumber(value) {
    if (typeof value === "boolean") return null;
    if (typeof value === "number") return Number.isFinite(value) ? value : null;
    if (typeof value !== "string") return null;
    let text = value.trim().replace(/ /g, "");
    if (!text) return null;
    const commas = (text.match(/,/g) || []).length;
    if (commas === 1 && !text.includes(".")) text = text.replace(",", ".");
    else text = text.replace(/,/g, "");
    if (!NUMBER_RE.test(text)) return null;
    const n = Number(text);
    return Number.isFinite(n) ? n : null;
  }

  function numberOrText(value) {
    const n = parseNumber(value);
    if (n !== null) return n;
    return value === null || value === undefined ? "" : String(value).trim();
  }

  function newResult() { return { errors: [], warnings: [] }; }

  function validateNumber(value, label, unit, result, opts) {
    const o = Object.assign({ required: true, minimum: null, maximum: null, min_inclusive: false, integer: false }, opts || {});
    const suffix = unit ? ` ${unit}` : "";
    if (isBlank(value)) {
      if (o.required) result.errors.push(`${label} is required.`);
      return null;
    }
    const n = parseNumber(value);
    if (n === null) {
      result.errors.push(`${label} must be a number (got '${value}').`);
      return null;
    }
    if (o.integer && !Number.isInteger(n)) {
      result.errors.push(`${label} must be a whole number.`);
      return null;
    }
    if (o.minimum !== null && o.minimum !== undefined) {
      if (o.min_inclusive && n < o.minimum) {
        result.errors.push(`${label} must be greater than or equal to ${g(o.minimum)}${suffix}.`);
        return null;
      }
      if (!o.min_inclusive && n <= o.minimum) {
        result.errors.push(`${label} must be greater than ${g(o.minimum)}${suffix}.`);
        return null;
      }
    }
    if (o.maximum !== null && o.maximum !== undefined && n > o.maximum) {
      result.errors.push(`${label} must not exceed ${g(o.maximum)}${suffix}.`);
      return null;
    }
    return n;
  }

  function validateChoice(value, label, choices, result) {
    if (!choices.includes(value)) {
      result.errors.push(`${label} must be one of: ${choices.join(", ")}.`);
      return null;
    }
    return String(value);
  }

  // ------------------------------------------------------------ spec access
  function designType(value) {
    const dt = SPEC.design_types.find((d) => d.value === value);
    if (!dt) throw new Error(`Unknown design type ${value}`);
    return dt;
  }

  function unitLabel(quantity, units) {
    const table = SPEC.unit_labels[units] || SPEC.unit_labels.SI;
    return table[quantity] || "";
  }

  function isActive(field, inputs) {
    if (!field.visible_when) return true;
    const [other, allowed] = field.visible_when;
    return allowed.includes(String(inputs[other] ?? ""));
  }

  function fieldLabel(dt, field) {
    return `${dt.title} ${field.label[0].toLowerCase()}${field.label.slice(1)}`;
  }

  function fieldUnit(field, units) {
    return field.kind === "choice" ? "" : unitLabel(field.quantity, units);
  }

  /** BaseDesign.check_field */
  function checkField(dt, field, value, units) {
    const result = newResult();
    const label = fieldLabel(dt, field);
    if (field.kind === "choice") validateChoice(value, label, field.choices, result);
    else validateNumber(value, label, unitLabel(field.quantity, units), result, {
      required: field.required, minimum: field.minimum, maximum: field.maximum,
      min_inclusive: field.min_inclusive, integer: field.kind === "integer",
    });
    return result.errors;
  }

  function defaultInputs(dt) {
    const inputs = {};
    for (const f of dt.fields) inputs[f.key] = f.default;
    return inputs;
  }

  const SPECIFIC = {
    column(v, r) {
      const least = v.shape === "Circular" ? v.width : Math.min(v.width, v.depth);
      if (2 * v.cover >= least) {
        r.errors.push(`Column concrete cover (${g(v.cover)} mm) is too large for the least section dimension (${g(least)} mm).`);
      }
      if (least < 150) r.warnings.push(`Least column dimension ${g(least)} mm is unusually small.`);
    },
    beam(v, r) {
      if (2 * v.cover >= Math.min(v.width, v.depth)) r.errors.push("Beam concrete cover is too large for the section dimensions.");
      if (v.depth < v.width) r.warnings.push("Beam depth is smaller than its width (check input order).");
    },
    slab(v, r) {
      if (v.short_span > v.long_span) r.errors.push("Slab short span Lx must not be greater than long span Ly.");
      if (2 * v.cover >= v.thickness) r.errors.push("Slab concrete cover is too large for the slab thickness.");
    },
    stair(v, r) {
      if (v.riser >= v.floor_height) r.errors.push("Stair riser height must be smaller than the flight rise.");
      if (2 * v.cover >= v.waist) r.errors.push("Stair concrete cover is too large for the waist thickness.");
    },
    footing(v, r) {
      if (v.column_width >= v.width * 1000) r.errors.push("Column width must be smaller than footing width B.");
      if (v.column_depth >= v.length * 1000) r.errors.push("Column depth must be smaller than footing length L.");
      if (2 * v.cover >= v.thickness) r.errors.push("Footing concrete cover is too large for the footing thickness.");
      if (v.embedment * 1000 < v.thickness) r.warnings.push("Footing base depth Df is less than the footing thickness.");
    },
  };

  function findByName(list, name, key) {
    return (list || []).find((x) => x[key || "name"] === name) || null;

  function findConcrete(project, name) { return findByName(project.materials.concrete, name); }
  function findGrade(project, name) { return findByName(project.reinforcement.grades, name); }

  function parseInputs(project, dtValue, member) {
    const dt = designType(dtValue);
    const units = project.design_settings.unit_system;
    const values = {};
    const result = newResult();
    for (const f of dt.fields) {
      if (!isActive(f, member.inputs)) continue;
      const raw = member.inputs[f.key];
      const errors = checkField(dt, f, raw, units);
      if (errors.length) { result.errors.push(...errors); continue; }
      values[f.key] = f.kind === "choice" ? String(raw) : parseNumber(raw);
    }
    return { values, result };
  }

  /** BaseDesign.validate */
  function validateMember(project, dtValue, member) {
    const dt = designType(dtValue);
    const { values, result } = parseInputs(project, dtValue, member);
    if (!String(member.name || "").trim()) result.errors.push(`${dt.title} name is required.`);
    if (!findConcrete(project, member.concrete)) result.errors.push(`Concrete grade '${member.concrete}' is not defined in the project.`);
    if (!findGrade(project, member.main_rebar)) result.errors.push(`Main reinforcement grade '${member.main_rebar}' is not defined.`);
    if (!findGrade(project, member.tie_rebar)) result.errors.push(`Tie/stirrup grade '${member.tie_rebar}' is not defined.`);
    if (!result.errors.length) SPECIFIC[dtValue](values, result);
    return result;
  }

  // ------------------------------------------------------------ engines
  function item(label, value, unit, note) {
    return { label, value, unit: unit || "", note: note || "" };
  }

  const ENGINES = {
    column: {
      name: "Column engine v0.1 (geometry)",
      items(v) {
        const w = v.width, h = v.clear_height;
        let area, perimeter, least;
        if (v.shape === "Circular") { area = Math.PI * w * w / 4; perimeter = Math.PI * w; least = w; }
        else { area = w * v.depth; perimeter = 2 * (w + v.depth); least = Math.min(w, v.depth); }
        return [
          item("Gross section area Ag", area, "mm²", `= ${grouped(area / 100, 1)} cm²`),
          item("Section perimeter", perimeter, "mm"),
          item("Concrete volume (clear height)", area * h / 1e9, "m³"),
          item("Clear height / least dimension", h / least, "-", "Geometric ratio only; slenderness check per standard pending"),
        ];
      },
    },
    beam: {
      name: "Beam engine v0.1 (geometry)",
      items(v) {
        const area = v.width * v.depth;
        return [
          item("Gross section area Ag", area, "mm²", `= ${grouped(area / 100, 1)} cm²`),
          item("Concrete volume", area * v.span / 1e6, "m³"),
          item("Span / total depth", v.span * 1000 / v.depth, "-", "Geometric ratio only; deflection check per standard pending"),
          item("Clear cover to depth ratio", v.cover / v.depth, "-"),
        ];
      },
    },
    slab: {
      name: "Slab engine v0.1 (geometry)",
      items(v) {
        const area = v.short_span * v.long_span;
        return [
          item("Panel area", area, "m²"),
          item("Concrete volume", area * v.thickness / 1000, "m³"),
          item("Long / short span ratio Ly/Lx", v.long_span / v.short_span, "-"),
          item("Short span / thickness", v.short_span * 1000 / v.thickness, "-", "Geometric ratio only; minimum thickness check per standard pending"),
        ];
      },
    },
    stair: {
      name: "Stair engine v0.1 (geometry)",
      items(v) {
        const risers = Math.max(1, Math.ceil(v.floor_height / v.riser - 1e-9));
        const actual = v.floor_height / risers;
        const treads = risers - 1;
        const going = treads * v.tread;
        const slope = Math.atan2(actual, v.tread) * 180 / Math.PI;
        const flight = treads ? Math.hypot(going, v.floor_height - actual) : 0;
        return [
          item("Number of risers", risers, "-"),
          item("Actual riser height", actual, "mm"),
          item("Number of treads", treads, "-"),
          item("Total horizontal going", going, "mm"),
          item("Flight slope angle", slope, "deg"),
          item("Inclined flight length (waist)", flight, "mm"),
        ];
      },
    },
    footing: {
      name: "Footing engine v0.1 (geometry)",
      items(v, units) {
        const area = v.width * v.length;
        const p = unitLabel("area_load", units);
        return [
          item("Footing plan area", area, "m²"),
          item("Concrete volume", area * v.thickness / 1000, "m³"),
          item("Average pressure P/A", v.service_load / area, p, "Service load only; excludes self-weight, soil and moment"),
          item("Allowable soil bearing (input)", v.allowable_bearing, p, "Bearing check per standard pending"),
        ];
      },
    },
  };

  function nowIso() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  /** GeometryOnlyEngine.run */
  function runEngine(project, dtValue, member, values) {
    const dt = designType(dtValue);
    const units = project.design_settings.unit_system;
    const standard = project.design_settings.design_standard;
    const engine = ENGINES[dtValue];
    const items = engine.items(values, units);
    const k = SPEC.app.ksc_to_mpa;
    const concrete = findConcrete(project, member.concrete);
    const main = findGrade(project, member.main_rebar);
    if (concrete) items.push(item("Concrete f'c", concrete.fc_ksc, "ksc", `= ${(concrete.fc_ksc * k).toFixed(2)} MPa`));
    if (main) items.push(item(`Main bar fy (${main.name})`, main.fy_ksc, "ksc", `= ${(main.fy_ksc * k).toFixed(1)} MPa`));
    return {
      status: "not_implemented",
      summary: `${dt.title}: geometry computed, design check pending.`,
      items,
      messages: [
        "Geometric properties were computed.",
        `Structural design check according to ${standard} is NOT implemented yet (${dt.title} design is planned for a later phase).`,
        "Results must not be used for construction.",
      ],
      standard,
      engine: engine.name,
      calculated_at: nowIso(),
    };
  }

  /** BaseDesign.calculate - returns {ok, result} or {ok:false, errors}. */
  function calculate(project, dtValue, member) {
    const validation = validateMember(project, dtValue, member);
    if (validation.errors.length) return { ok: false, errors: validation.errors };
    const { values } = parseInputs(project, dtValue, member);
    const result = runEngine(project, dtValue, member, values);
    result.messages = [...validation.warnings, ...result.messages];
    member.result = result;
    member.modified_at = nowIso();
    return { ok: true, result };
  }

  function center(text, width) {
    const pad = Math.max(0, width - text.length);
    const left = Math.floor(pad / 2);
    return " ".repeat(left) + text + " ".repeat(pad - left);
  }

    const settings = project.design_settings;
    const std = SPEC.standards.find((s) => s.value === settings.design_standard);
    const unitsSpec = SPEC.units.find((u) => u.value === settings.unit_system);
    const L = [];
    const rule = (c) => L.push(c.repeat(W));
    const title = (t) => { L.push(""); L.push(t.toUpperCase()); rule("-"); };
    const pad = (s, n) => (s + " ".repeat(n)).slice(0, Math.max(n, s.length));
    rule("=");
    L.push(center(`${SPEC.app.name}  v${SPEC.app.version}`, W));
    L.push(center(`${dt.description} - Calculation Sheet`, W));
    rule("=");
    const rows = [
      ["Project", info.project_name], ["Project No.", info.project_number],
      ["Organization", info.organization], ["Designer", info.designer],
      ["Checker", info.checker], ["Date", info.project_date],
      ["Design standard", std ? std.label : settings.design_standard],
      ["Unit system", unitsSpec ? unitsSpec.label : settings.unit_system],
      ["Member", `${dt.title} ${member.name}`],
    ];
    for (const [k, v] of rows) L.push(`${pad(k, 18)}: ${v || ""}`);

    title("1. Materials");
    const c = findConcrete(project, member.concrete);
    const m = findGrade(project, member.main_rebar);
    const t = findGrade(project, member.tie_rebar);
    L.push(`${pad("Concrete", 18)}: ${member.concrete}` + (c ? `  (f'c = ${g(c.fc_ksc)} ksc)` : ""));
    L.push(`${pad("Main bars", 18)}: ${member.main_rebar}` + (m ? `  (fy = ${g(m.fy_ksc)} ksc)` : ""));
    L.push(`${pad("Ties / stirrups", 18)}: ${member.tie_rebar}` + (t ? `  (fy = ${g(t.fy_ksc)} ksc)` : ""));

    title("2. Input data");
    for (const f of dt.fields) {
      if (!isActive(f, member.inputs)) continue;
      let value = member.inputs[f.key] ?? "";
      if (typeof value === "number") value = g(value);
      L.push(`${pad(f.label, 40)} = ${value} ${fieldUnit(f, settings.unit_system)}`.trimEnd());
    }

    title("3. Input validation");
    const v = validateMember(project, dtValue, member);
    if (!v.errors.length) L.push("All inputs are valid.");
    for (const e of v.errors) L.push(`[ERROR]   ${e}`);
    for (const w of v.warnings) L.push(`[WARNING] ${w}`);

    title("4. Results");
    const r = member.result || { status: "not_calculated", items: [], messages: [] };
    L.push(`Status : ${STATUS_LABELS[r.status] || r.status}`);
    if (r.calculated_at && r.engine) L.push(`Engine : ${r.engine}  (${r.calculated_at})`);
    if (r.summary) L.push(`Summary: ${r.summary}`);
    if ((r.items || []).length) {
      L.push("");
      for (const it of r.items) {
        const note = it.note ? `  [${it.note}]` : "";
        const fv = formatValue(it.value);
        L.push(`${pad(it.label, 40)} = ${" ".repeat(Math.max(0, 14 - fv.length))}${fv} ${it.unit}${note}`);
      }
    }
    if ((r.messages || []).length) {
      L.push("");
      for (const msg of r.messages) L.push(`- ${msg}`);
    }
    L.push("");
    rule("=");
    L.push("NOTE: structural design checks per the selected standard are not implemented yet.");
    rule("=");
    return L.join("\n");
  }

  // ------------------------------------------------------------ project model
  function uid() {
    if (root.crypto && root.crypto.randomUUID) return root.crypto.randomUUID().replace(/-/g, "");
    return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join("");
  }

  function today() { return nowIso().slice(0, 10); }

  function emptyInfo() {
    return { project_name: "", project_number: "", designer: "", checker: "", organization: "",
      project_date: today(), location: "", description: "" };
  }

  function newProject(info, settings) {
    const d = SPEC.default_settings;
    const s = Object.assign({}, d, settings || {});
    const std = SPEC.standards.find((x) => x.value === s.design_standard);
    const p = {
      project_information: Object.assign(emptyInfo(), info || {}),
      design_settings: s,
      design_standard: { code: s.design_standard, label: std ? std.label : s.design_standard },
      materials: { concrete: JSON.parse(JSON.stringify(SPEC.materials.concrete)) },
      reinforcement: {
        grades: JSON.parse(JSON.stringify(SPEC.materials.rebar_grades)),
        sizes: JSON.parse(JSON.stringify(SPEC.materials.rebar_sizes)),
      },
      metadata: { created_at: nowIso(), modified_at: nowIso(), app_version: SPEC.app.version },
    };
    for (const dt of SPEC.design_types) p[dt.project_key] = [];
    return p;
  }

  function members(project, dtValue) {
    const key = designType(dtValue).project_key;
    if (!Array.isArray(project[key])) project[key] = [];
    return project[key];
  }

  function nameTaken(project, dtValue, name, excludeId) {
    const want = String(name).trim().toLowerCase();
    return members(project, dtValue).some((m) => m.name.trim().toLowerCase() === want && m.member_id !== excludeId);
  }

  function nextMemberName(project, dtValue) {
    const prefix = designType(dtValue).prefix;
    let i = 1;
    while (nameTaken(project, dtValue, `${prefix}${i}`)) i += 1;
    return `${prefix}${i}`;
  }

  function newMember(project, dtValue) {
    const s = project.design_settings;
    const now = nowIso();
    return {
      member_id: uid(), name: nextMemberName(project, dtValue),
      inputs: defaultInputs(designType(dtValue)),
      concrete: s.default_concrete, main_rebar: s.default_main_rebar, tie_rebar: s.default_tie_rebar,
      result: null, notes: "", created_at: now, modified_at: now,
    };
  }

  function syncStandardLabel(project) {
    const s = project.design_settings;
    const std = SPEC.standards.find((x) => x.value === s.design_standard);
    project.design_standard = { code: s.design_standard, label: std ? std.label : s.design_standard };
  }

  /** ProjectManager.serialize */
  function serialize(project) {
    syncStandardLabel(project);
    project.metadata = Object.assign({}, project.metadata, { modified_at: nowIso(), app_version: SPEC.app.version });
    return {
      file_format: SPEC.app.file_format,
      format_version: SPEC.app.format_version,
      application: { name: SPEC.app.name, version: SPEC.app.version },
      saved_at: nowIso(),
      project,
    };
  }

  /** ProjectManager.deserialize + Project.from_dict (tolerant). Throws Error with a readable message. */
  function deserialize(data) {
    if (!data || typeof data !== "object" || data.file_format !== SPEC.app.file_format) {
      throw new Error(`The selected file is not a ${SPEC.app.name} project file.`);
    }
    const v = data.format_version;
    if (!Number.isInteger(v) || v < 1) throw new Error("The project file has an invalid format version.");
    if (v > SPEC.app.format_version) {
      throw new Error(`This project was created with a newer version of ${SPEC.app.name} (file format ${v}). Please update the program.`);
    }
    const src = data.project;
    if (!src || typeof src !== "object") throw new Error("The project file does not contain project data.");
    const p = newProject(src.project_information || {}, src.design_settings || {});
    for (const k of Object.keys(p.project_information)) {
      const val = (src.project_information || {})[k];
      p.project_information[k] = val === null || val === undefined ? p.project_information[k] : String(val);
    }
    const conc = (src.materials || {}).concrete;
    if (Array.isArray(conc) && conc.length) p.materials.concrete = conc;
    const reinf = src.reinforcement || {};
    if (Array.isArray(reinf.grades) && reinf.grades.length) p.reinforcement.grades = reinf.grades;
    if (Array.isArray(reinf.sizes) && reinf.sizes.length) p.reinforcement.sizes = reinf.sizes;
    p.metadata = Object.assign(p.metadata, src.metadata || {});
    for (const dt of SPEC.design_types) {
      const list = Array.isArray(src[dt.project_key]) ? src[dt.project_key] : [];
      p[dt.project_key] = list.filter((m) => m && typeof m === "object").map((m) => ({
        member_id: m.member_id || uid(), name: String(m.name ?? dt.prefix),
        inputs: m.inputs && typeof m.inputs === "object" ? m.inputs : {},
        concrete: String(m.concrete ?? ""), main_rebar: String(m.main_rebar ?? ""), tie_rebar: String(m.tie_rebar ?? ""),
        result: m.result && typeof m.result === "object" ? m.result : null,
        notes: String(m.notes ?? ""), created_at: m.created_at || nowIso(), modified_at: m.modified_at || nowIso(),
      }));
    }
    syncStandardLabel(p);
    return p;
  }

  /** Members referencing a material (ProjectMaterials.usage, simplified for display). */
  function materialUsage(project, kind, name) {
    const attrs = kind === "concrete" ? ["concrete"] : kind === "rebar_grade" ? ["main_rebar", "tie_rebar"] : [];
    let count = 0;
    for (const dt of SPEC.design_types) {
      for (const m of members(project, dt.value)) if (attrs.some((a) => m[a] === name)) count += 1;
    }
    return count;
  }

  const RC = {
    SPEC, STATUS_LABELS, g, grouped, formatValue, parseNumber, numberOrText, isBlank,
    designType, unitLabel, isActive, fieldLabel, fieldUnit, checkField, defaultInputs,
    validateMember, calculate, runEngine, parseInputs, buildReport, nowIso, today,
    newProject, newMember, members, nameTaken, nextMemberName, serialize, deserialize,
    findConcrete, findGrade, materialUsage, emptyInfo, syncStandardLabel, uid,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = RC;
  else root.RC = RC;
})(typeof window !== "undefined" ? window : globalThis);

  function writeStore() {
    clearTimeout(persistTimer);

    if (!state.project) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        file: RC.serialize(JSON.parse(JSON.stringify(state.project))),
        fileName: state.fileName, modified: state.modified,
        view: state.view,
      }));
    } catch (e) { /* storage unavailable: the page still works */ }
  }
  function persist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(writeStore, 250);
  }
  function flushStore() { if (persistTimer) writeStore(); }

  function restore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      state.project = RC.deserialize(data.file);
      state.fileName = data.fileName || "";
      state.modified = !!data.modified;
      state.view = data.view || "design";
      return true;
    } catch (e) {
      return false;
    }
  }

  function renderTabs() {

  function go(view) {
    if (!VIEWS.includes(view)) view = state.project ? "design" : "start";

    state.view = view;
    if (location.hash !== "#" + view) {

    render();
    window.scrollTo(0, 0);

  function textField(id, label, value, oninput, opts) {

      id, type: o.multiline ? null : (o.type || "text"), value: value || "", rows: o.multiline ? 3 : null,

  function selectField(id, label, options, value, onchange) {

  // ================================================================ editor
  function currentMember(dtValue) {
    const list = RC.members(state.project, dtValue);
    let m = list.find((x) => x.member_id === state.selected[dtValue]);
    if (!m && list.length) { m = list[0]; state.selected[dtValue] = m.member_id; }
    return m || null;
  }

  function memberIssues(dtValue, m) {
    const v = RC.validateMember(state.project, dtValue, m);
    if (m.name.trim() && RC.nameTaken(state.project, dtValue, m.name, m.member_id)) {
      v.errors.push(`${dtByValue(dtValue).title} name '${m.name.trim()}' is already used.`);
    }
    return v;
  }

  function renderEditor(dtValue) {
    const dt = dtByValue(dtValue);
    const p = state.project;
    const list = RC.members(p, dtValue);
    const member = currentMember(dtValue);
    const wrap = h("div");
    wrap.append(h("div", { class: "view-head" },
      h("div", { class: "icon", svg: icon(dtValue, 44) }),
      h("div", {}, h("h1", {}, `${dt.title} Design`),
        h("p", {}, `${dt.description} · ${p.design_settings.design_standard} · ${p.design_settings.unit_system}`))));

    // ---- member list
    const listEl = h("ul", { class: "member-list", "aria-label": `${dt.title}s` });
    for (const m of list) {
      listEl.append(h("li", {}, h("button", {
        class: "member-btn", type: "button", "aria-current": member && m.member_id === member.member_id ? "true" : "false",

      }, h("span", { class: "dot" + (m.result ? " done" : ""), title: m.result ? "Calculated" : "Not calculated" }),
      h("span", { class: "mname" }, m.name || "(no name)"))));
    }
    const addMember = () => {
      const m = RC.newMember(p, dtValue);
      list.push(m);
      state.selected[dtValue] = m.member_id;
      markModified();
      render();
      const name = document.getElementById("m-name");
      if (name) { name.focus(); name.select(); }
    };
    const tools = h("div", { class: "member-tools" },
      h("button", { class: "btn small", type: "button", onclick: addMember }, "Add"),
      h("button", { class: "btn small", type: "button", disabled: !member, onclick: () => {
        const copy = JSON.parse(JSON.stringify(member));
        Object.assign(copy, { member_id: RC.uid(), name: RC.nextMemberName(p, dtValue), created_at: RC.nowIso(), modified_at: RC.nowIso() });
        list.push(copy);
        state.selected[dtValue] = copy.member_id;
        markModified(); render();
      } }, "Duplicate"),
      h("button", { class: "btn small danger", type: "button", disabled: !member, onclick: () => {
        confirmBox(`Delete ${dt.value} ${member.name}?`, "This removes the member and its results from the project.", "Delete", () => {

    const nameErr = h("div", { class: "err", hidden: true });

    form.append(h("div", { class: "panel-head" }, `${dt.title} ${member.name}`, h("span", { class: "hint" }, "* required")));

      h("div", { class: "row" }, h("label", { for: "m-notes" }, "Notes"), h("div", { class: "input-wrap" }, notes)))));

      } else {

      h("span", { class: "spacer" }),
      h("button", { class: "btn", type: "button", onclick: () => openReport(dtValue, member) }, "Report"),
      h("button", { class: "btn primary", type: "button", onclick: () => {
        const v = refreshIssues(true);
        dt.fields.forEach(setFieldError);
        if (v.errors.length) { toast("Invalid input. Fix the highlighted fields.", true); return; }
        const out = RC.calculate(p, dtValue, member);
        if (!out.ok) { toast(out.errors[0], true); return; }
        renderResults(outStack, dtValue, member);
        const dot = document.querySelector(`.member-btn[data-id="${member.member_id}"] .dot`);
        if (dot) dot.classList.add("done");
        markModified();
        toast(`${dt.title} ${member.name} calculated.`);
      } }, "Calculate"));
    form.append(issuesEl, calcBar);

    // ---- output
    outStack.append(h("section", { class: "panel", id: "sketch" },
      h("div", { class: "panel-head" }, "Geometry Sketch", h("span", { class: "hint" }, "not to scale for loads")), drawing));
    renderResults(outStack, dtValue, member);

    wrap.append(h("div", { class: "editor" }, members, form, outStack));
    updateVisibility();
    dt.fields.forEach((f) => { if (member.inputs[f.key] !== undefined) setFieldError(f); });
    refreshIssues(false);
    drawPreview(drawing, dtValue, member.inputs);
    return wrap;
  }

  function renderResults(stack, dtValue, member) {
    const old = stack.querySelector("#results");
    const r = member.result || { status: "not_calculated", items: [], messages: [] };
    const body = r.items && r.items.length
      ? h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Item"), h("th", { style: "text-align:right" }, "Value"), h("th", {}, "Unit"))),
        h("tbody", {}, r.items.map((it) => h("tr", {},
          h("td", {}, it.label, it.note ? h("span", { class: "note" }, it.note) : null),
          h("td", { class: "v" }, RC.formatValue(it.value)),
          h("td", { class: "u" }, it.unit))))))
      : h("div", { class: "empty" }, "Press Calculate to compute this member.");
    const panel = h("section", { class: "panel", id: "results" },
      h("div", { class: "panel-head" }, "Results",
        h("span", { class: "hint" }, h("span", { class: "status " + r.status }, RC.STATUS_LABELS[r.status] || r.status))),
      body,
      r.messages && r.messages.length ? h("ul", { class: "msgs" }, r.messages.map((m) => h("li", {}, m))) : null);
    if (old) old.replaceWith(panel); else stack.append(panel);
  }

  // ================================================================ drawings
  function drawPreview(container, dtValue, raw) {
    const W = 340, H = 240, PAD = 34;
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Geometry sketch" });
    const v = {};
    for (const [k, val] of Object.entries(raw)) v[k] = RC.parseNumber(val);
    const pos = (...keys) => keys.every((k) => v[k] !== null && v[k] > 0);
    const fit = (w, hgt) => {
      const scale = Math.min((W - 2 * PAD) / w, (H - 2 * PAD - 14) / hgt);
      return { scale, x0: (W - w * scale) / 2, y0: 20 + (H - 20 - hgt * scale) / 2 };
    };
    const title = (t) => svg.append(s("text", { x: W / 2, y: 16, "text-anchor": "middle", class: "title" }, t));
    const fail = () => {
      svg.replaceChildren(s("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "title" }, "Sketch unavailable — check the inputs"));
    };
    const dimH = (x1, x2, y, label) => {
      svg.append(s("path", { d: `M${x1} ${y}H${x2}M${x1} ${y - 4}v8M${x2} ${y - 4}v8`, class: "dim" }));
      svg.append(s("text", { x: (x1 + x2) / 2, y: y + 13, "text-anchor": "middle" }, label));
    };
    const dimV = (x, y1, y2, label) => {
      svg.append(s("path", { d: `M${x} ${y1}V${y2}M${x - 4} ${y1}h8M${x - 4} ${y2}h8`, class: "dim" }));
      svg.append(s("text", { x: x - 6, y: (y1 + y2) / 2, "text-anchor": "end", "dominant-baseline": "middle" }, label));
    };
    try {
      if (dtValue === "column" && raw.shape === "Circular") {
        if (!pos("width")) return container.replaceChildren(svg), fail();
        const d = v.width, f = fit(d, d), r = d * f.scale / 2, cx = W / 2, cy = f.y0 + r;
        svg.append(s("circle", { cx, cy, r, class: "shape" }));
        if (v.cover > 0 && v.cover < d / 2) svg.append(s("circle", { cx, cy, r: r - v.cover * f.scale, class: "inner" }));
        title(`Circular column D = ${RC.g(d)} mm`);
        dimH(cx - r, cx + r, cy + r + 10, `${RC.g(d)}`);
      } else if (dtValue === "column" || dtValue === "beam") {
        if (!pos("width", "depth")) return container.replaceChildren(svg), fail();
        const b = v.width, d = v.depth, f = fit(b, d), x = f.x0, y = f.y0, w = b * f.scale, hh = d * f.scale;
        svg.append(s("rect", { x, y, width: w, height: hh, class: "shape" }));
        const c = v.cover || 0;
        if (c > 0 && 2 * c < Math.min(b, d)) svg.append(s("rect", { x: x + c * f.scale, y: y + c * f.scale, width: w - 2 * c * f.scale, height: hh - 2 * c * f.scale, class: "inner" }));
        title(`${dtValue === "beam" ? "Beam" : "Column"} section ${RC.g(b)} × ${RC.g(d)} mm`);
        dimH(x, x + w, y + hh + 10, RC.g(b));
        dimV(x - 10, y, y + hh, RC.g(d));
      } else if (dtValue === "slab") {
        if (!pos("short_span", "long_span")) return container.replaceChildren(svg), fail();
        const lx = v.short_span, ly = v.long_span, f = fit(ly, lx), w = ly * f.scale, hh = lx * f.scale;
        svg.append(s("rect", { x: f.x0, y: f.y0, width: w, height: hh, class: "shape" }));
        title(`${raw.slab_type || ""} slab plan`);
        dimH(f.x0, f.x0 + w, f.y0 + hh + 10, `Ly = ${RC.g(ly)} m`);
        dimV(f.x0 - 10, f.y0, f.y0 + hh, `Lx = ${RC.g(lx)} m`);
      } else if (dtValue === "stair") {
        if (!pos("floor_height", "riser", "tread")) return container.replaceChildren(svg), fail();
        const n = Math.max(1, Math.ceil(v.floor_height / v.riser - 1e-9));
        if (n > 200) return container.replaceChildren(svg), fail();
        const actual = v.floor_height / n, run = Math.max((n - 1) * v.tread, v.tread);
        const f = fit(run, v.floor_height), X = (x) => f.x0 + x * f.scale, Y = (y) => f.y0 + (v.floor_height - y) * f.scale;
        let x = 0, y = 0, d = `M${X(0)} ${Y(0)}`;
        for (let i = 0; i < n; i++) { y += actual; d += `L${X(x)} ${Y(y)}`; if (i < n - 1) { x += v.tread; d += `L${X(x)} ${Y(y)}`; } }
        d += `L${X(x)} ${Y(y - actual * 0.6)}L${X(v.tread * 0.6)} ${Y(0)}Z`;
        svg.append(s("path", { d, class: "shape" }));
        title(`${n} risers × ${actual.toFixed(0)} mm, tread ${RC.g(v.tread)} mm`);
      } else if (dtValue === "footing") {
        if (!pos("width", "length")) return container.replaceChildren(svg), fail();
        const B = v.width, L = v.length, f = fit(B, L), w = B * f.scale, hh = L * f.scale;
        svg.append(s("rect", { x: f.x0, y: f.y0, width: w, height: hh, class: "shape" }));
        const cx = (v.column_width || 0) / 1000, cy = (v.column_depth || 0) / 1000;
        if (cx > 0 && cy > 0 && cx < B && cy < L) {
          svg.append(s("rect", { x: f.x0 + (B - cx) / 2 * f.scale, y: f.y0 + (L - cy) / 2 * f.scale, width: cx * f.scale, height: cy * f.scale, class: "col" }));
        }
        title(`Footing plan ${RC.g(B)} × ${RC.g(L)} m`);
        dimH(f.x0, f.x0 + w, f.y0 + hh + 10, `B = ${RC.g(B)} m`);
        dimV(f.x0 - 10, f.y0, f.y0 + hh, `L = ${RC.g(L)}`);
      }
    } catch (e) {
      fail();
    }
    container.replaceChildren(svg);
  }

  // ================================================================ materials view
  function renderMaterials() {
    const p = state.project;
    const k = SPEC.app.ksc_to_mpa;
    const ds = p.design_settings;
    const fmt = (x) => (x === null || x === undefined || x === "" ? "by standard" : RC.g(Number(x)));
    const table = (heads, rows, numeric) => h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, heads.map((t, i) => h("th", { style: numeric.includes(i) ? "text-align:right" : null }, t)))),
      h("tbody", {}, rows.map((r) => h("tr", {}, r.map((c, i) => h("td", { class: numeric.includes(i) ? "v" : null }, c)))))));
    const tags = (name, kind) => {
      const out = [];
      if (kind === "concrete" && ds.default_concrete === name) out.push("default");
      if (kind === "rebar_grade" && ds.default_main_rebar === name) out.push("default main");
      if (kind === "rebar_grade" && ds.default_tie_rebar === name) out.push("default ties");
      const n = RC.materialUsage(p, kind, name);
      if (n) out.unshift(`${n} member(s)`);
      return out.join(", ") || "—";
    };
    return h("div", {},
      h("div", { class: "view-head" }, h("div", {}, h("h1", {}, "Project Materials"),
        h("p", {}, "Materials stored in this project file. To create or edit materials, use Tools → Material Database in the desktop program."))),
      h("div", { class: "out-stack" },
        h("section", { class: "panel" }, h("div", { class: "panel-head" }, "Concrete"),
          table(["Name", "f'c (ksc)", "f'c (MPa)", "Unit wt (kg/m³)", "Ec (ksc)", "Used by"],
            p.materials.concrete.map((c) => [c.name, RC.g(c.fc_ksc), (c.fc_ksc * k).toFixed(2), RC.g(c.unit_weight_kg_m3 ?? 2400), fmt(c.ec_ksc), tags(c.name, "concrete")]),
            [1, 2, 3, 4])),
        h("section", { class: "panel" }, h("div", { class: "panel-head" }, "Reinforcement Grades"),
          table(["Name", "Bar type", "fy (ksc)", "fy (MPa)", "fu (ksc)", "Es (ksc)", "Product standard", "Used by"],
            p.reinforcement.grades.map((g) => [g.name, g.bar_type, RC.g(g.fy_ksc), (g.fy_ksc * k).toFixed(1), g.fu_ksc ? RC.g(g.fu_ksc) : "—", fmt(g.es_ksc), g.standard || "", tags(g.name, "rebar_grade")]),
            [2, 3, 4, 5])),
        h("section", { class: "panel" }, h("div", { class: "panel-head" }, "Bar Sizes"),
          table(["Designation", "Bar type", "Diameter (mm)", "Area (mm²)"],
            p.reinforcement.sizes.map((b) => [b.designation, b.bar_type, RC.g(b.diameter_mm), (Math.PI * b.diameter_mm ** 2 / 4).toFixed(1)]),
            [2, 3])),
        h("p", { class: "brand-sub" }, "1 ksc = 0.0980665 MPa · bar area = π·d²/4 · Ec / Es “by standard” will be taken from the selected design standard in a later phase.")));
  }

  // ================================================================ help
  function renderHelp() {
    return h("div", { class: "prose" },
      h("div", { class: "view-head" }, h("div", {}, h("h1", {}, "Help"), h("p", {}, `${SPEC.app.name} v${SPEC.app.version} · ${SPEC.app.phase} · Web`))),
      h("div", { class: "banner" }, h("b", {}, "Phase notice."),
        h("span", {}, "Only geometric quantities are calculated. Structural design checks according to the selected standard are not implemented yet. Do not use the results for construction.")),
      h("h2", {}, "1. Start a project"),
      h("ol", {}, h("li", {}, "Press New, enter the Project Name and choose the design standard and unit system."),
        h("li", {}, "Open the Design tab and pick Column, Beam, Slab, Stair or Footing."),
        h("li", {}, "Add a member, fill in the form (fields with * are required) and press Calculate."),
        h("li", {}, "Report shows the calculation sheet; you can copy it or save it as a .txt file.")),
      h("h2", {}, "2. Save and open"),
      h("ul", {}, h("li", {}, "Save gives you a file named like project.rcproj.json. The desktop program opens it directly."),
        h("li", {}, "Open accepts .rcproj files from the desktop program and .rcproj.json files saved here."),
        h("li", {}, "Your work is also kept in this browser between visits, but only on this device. Save a file to keep it safe or move it to another device.")),
      h("h2", {}, "3. Units"),
      h("p", {}, "Section dimensions are in mm and spans in m. Loads follow the unit system of the project (SI: kN, kN·m, kN/m² · MKS: kgf, kgf·m, kgf/m²). Changing the unit system later does not convert values already entered."),
      h("h2", {}, "4. Same engine as the desktop program"),
      h("p", {}, "Input fields, limits, units and built-in materials are generated from the desktop program's Python code. The web calculations are tested against the Python results."),
      h("h2", {}, "5. Reset"),
      h("p", {}, "Reset closes the current project and deletes the copy kept in this browser, so you can start a new job. Saved project files are not affected."),
      h("button", { class: "btn danger", type: "button", onclick: resetData }, "Reset this browser's data"));
  }

  // ================================================================ modals
  function modal(title, body, buttons, narrow) {
    const root = document.getElementById("modal-root");
    let back = null;
    // Only close this dialog; a button may already have opened the next one.
    const close = () => {
      document.removeEventListener("keydown", onKey);
      if (back && back.isConnected) root.replaceChildren();
    };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    const footer = h("footer", {}, buttons.map(([label, cls, fn]) =>
      h("button", { class: "btn " + (cls || ""), type: "button", onclick: () => { if (fn() !== false) close(); } }, label)));
    const box = h("div", { class: "modal" + (narrow ? " narrow" : ""), role: "dialog", "aria-modal": "true", "aria-label": title },
      h("header", {}, h("h2", {}, title)), h("div", { class: "body" }, body), footer);
    back = h("div", { class: "modal-back", onclick: (e) => { if (e.target === back) close(); } }, box);
    root.replaceChildren(back);
    const first = box.querySelector("input, select, textarea, button.primary");
    if (first) first.focus();
    return close;
  }

  function confirmBox(title, text, okLabel, onOk) {
    modal(title, h("p", {}, text), [["Cancel", "", () => {}], [okLabel, "primary", () => { onOk(); }]], true);
  }

  function confirmDiscard(next) {
    if (!state.project || !state.modified) { next(); return; }
    confirmBox("Unsaved changes",
      `The project “${state.project.project_information.project_name || "Untitled"}” has changes that are not saved to a file. Continue without saving?`,
      "Continue without saving", next);
  }

  function newProjectDialog() {
    const info = RC.emptyInfo();
    const settings = Object.assign({}, SPEC.default_settings);
    const err = h("p", { class: "err", hidden: true });
    const grid = h("div", { class: "form-grid" });
    for (const [key, label, required] of INFO_FIELDS) {
      grid.append(textField(`new-${key}`, label, info[key], (value) => { info[key] = value; },
        { required, type: key === "project_date" ? "date" : "text" }));
    }
    grid.append(
      selectField("new-standard", "Design Standard", SPEC.standards.map((x) => [x.value, x.label]), settings.design_standard, (v) => { settings.design_standard = v; }),
      selectField("new-units", "Unit System", SPEC.units.map((x) => [x.value, x.label]), settings.unit_system, (v) => { settings.unit_system = v; }));
    modal("New Project", h("div", {}, grid, err), [
      ["Cancel", "", () => {}],
      ["Create", "primary", () => {
        if (!info.project_name.trim()) {
          err.hidden = false; err.textContent = "Project Name is required.";
          const f = document.getElementById("new-project_name");
          const field = f.closest(".field");
          field.classList.add("invalid");
          const fieldErr = field.querySelector(".err");
          fieldErr.hidden = false; fieldErr.textContent = "Project Name is required.";
          f.focus();
          return false;
        }
        for (const k of Object.keys(info)) info[k] = String(info[k]).trim();
        state.project = RC.newProject(info, settings);
        state.fileName = ""; state.modified = true; state.selected = {};
        go("design");
        toast("New project created. Select a design type.");
        return true;
      }]]);
  }

  async function openReport(dtValue, member) {
    const text = RC.buildReport(state.project, dtValue, member);
    const pre = h("pre", { class: "report" }, text);
    const base = `${dtValue}_${member.name || "member"}`.replace(/[^\w\-]+/g, "_");
    modal(`${dtByValue(dtValue).title} ${member.name} — Calculation Report`, pre, [
      ["Copy", "", () => { copyText(text, pre); return false; }],
      ["Save as .txt", "", () => { saveFile(`${base}_report.txt`, text, "Report saved."); return false; }],
      ["Close", "primary", () => {}]]);
  }

  async function copyText(text, fallbackEl) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied to clipboard.");
    } catch (e) {
      if (fallbackEl) {
        const range = document.createRange();
        range.selectNodeContents(fallbackEl);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      toast("Copy is blocked here. The text is selected; press Ctrl+C.", true);
    }
  }

  // ================================================================ file operations
  let downloadsPromise = null;
  function downloads() {
    if (!downloadsPromise) {
      downloadsPromise = (window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads").catch(() => null)
        : Promise.resolve(null);
    }
    return downloadsPromise;
  }

  async function saveFile(filename, data, okMessage) {
    const dl = await downloads();
    if (!dl) { showRawFile(filename, data); return false; }
    try {
      await dl.save({ filename, data });
      toast(okMessage);
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") toast("Save cancelled.");
      else if (code === "rate_limited") toast("A save prompt is already open.", true);
      else showRawFile(filename, data);
      return false;
    }
  }

  function showRawFile(filename, data) {
    const ta = h("textarea", { class: "raw", readonly: true });
    ta.value = data;
    modal("Save manually", h("div", {},
      h("p", {}, `Saving files is not available in this view. Copy the text below and save it as “${filename}”.`), ta), [
      ["Copy", "", () => { copyText(data, null); ta.select(); return false; }],
      ["Close", "primary", () => {}]]);
  }

  function projectFileName() {
    if (state.fileName) {
      return state.fileName.toLowerCase().endsWith(".json") ? state.fileName : state.fileName + ".json";
    }
    const name = (state.project.project_information.project_name || "Untitled").replace(/[\\/:*?"<>|]+/g, "_").trim();
    return `${name || "Untitled"}${SPEC.app.extension}.json`;
  }

  async function saveProject() {
    if (!state.project) return;
    const filename = projectFileName();
    const data = JSON.stringify(RC.serialize(state.project), null, 2) + "\n";
    const ok = await saveFile(filename, data, `Saved ${filename}`);
    if (ok) {
      state.fileName = filename; state.modified = false;
      updateChrome(); persist();
      if (state.view === "project") render();
    }
  }

  function openProject() {
    confirmDiscard(() => document.getElementById("file-input").click());
  }

  function onFileChosen(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const project = RC.deserialize(JSON.parse(String(reader.result)));
        state.project = project; state.fileName = file.name; state.modified = false; state.selected = {};
        go("design");
        toast(`Opened ${file.name}`);
      } catch (err) {
        const msg = err instanceof SyntaxError
          ? `“${file.name}” is corrupted or is not a valid project file.` : err.message;
        modal("Open Project", h("p", {}, "The project could not be opened.", h("br"), msg), [["OK", "primary", () => {}]], true);
      }
    };
    reader.onerror = () => toast("The file could not be read.", true);
    reader.readAsText(file);
  }

  // ================================================================ start
  function start() {
    const restored = restore();
    if (!restored) { state.project = null; state.view = "start"; }
    const fromHash = location.hash.replace("#", "");
    if (VIEWS.includes(fromHash)) state.view = fromHash;
    if (!state.project && state.view !== "help") state.view = "start";
    document.getElementById("btn-new").addEventListener("click", () => confirmDiscard(newProjectDialog));
    document.getElementById("btn-open").addEventListener("click", openProject);
    document.getElementById("btn-save").addEventListener("click", saveProject);
    document.getElementById("file-input").addEventListener("change", onFileChosen);
    window.addEventListener("pagehide", flushStore);
    document.addEventListener("visibilitychange", () => { if (document.hidden) flushStore(); });
    window.addEventListener("hashchange", () => {
      const v = location.hash.replace("#", "");
      if (VIEWS.includes(v) && v !== state.view) go(v);
    });
    render();
    downloads();
    if (restored) toast("Restored your last session from this browser.");
  }

  start();
})();

</script>
